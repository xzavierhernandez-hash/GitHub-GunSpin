<!DOCTYPE html>
<html lang="en-us">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GunSpin</title>

<link rel="shortcut icon"
href="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/TemplateData/favicon.ico">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/TemplateData/style.css">

<script src="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/TemplateData/UnityProgress.js"></script>

<script src="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/Build/UnityLoader.js"></script>

<style>

/* =========================
   PAGE
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}


/* =========================
   UNITY GAME
========================= */

#unityContainer {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 100vw;
    height: 66.6667vw;

    max-width: 100vw;
    max-height: 100vh;

    background: #000;
}


/* =========================
   VAULT BUTTON
========================= */

#vaultButton {

    position: fixed;

    top: 12px;
    right: 12px;

    z-index: 999999;

    padding: 10px 18px;

    background: #111;
    color: #fff;

    border: 2px solid #888;
    border-radius: 8px;

    font-family: Arial, sans-serif;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 2px 8px rgba(0,0,0,.6);

    transition:
        background .15s,
        transform .15s;
}

#vaultButton:hover {
    background: #292929;
}

#vaultButton:active {
    transform: scale(.96);
}


/* =========================
   VAULT OVERLAY
========================= */

#vault {

    display: none;

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1000000;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.88);
}


/* =========================
   VAULT BOX
========================= */

#vaultBox {

    width: 360px;
    max-width: 90vw;

    padding: 24px;

    background: #151515;

    color: #fff;

    border: 2px solid #777;
    border-radius: 14px;

    text-align: center;

    font-family: Arial, sans-serif;

    box-shadow:
        0 0 35px rgba(0,0,0,.9);
}


/* =========================
   TITLE
========================= */

#vaultTitle {

    font-size: 30px;

    font-weight: bold;

    margin-bottom: 8px;
}

#vaultDescription {

    color: #aaa;

    margin-bottom: 18px;
}


/* =========================
   CODE DISPLAY
========================= */

#codeDisplay {

    width: 100%;
    height: 55px;

    margin-bottom: 15px;

    background: #000;

    border: 2px solid #666;
    border-radius: 8px;

    color: #fff;

    font-family: monospace;

    font-size: 30px;
    font-weight: bold;

    letter-spacing: 8px;

    line-height: 51px;

    text-align: center;

    user-select: none;
}


/* =========================
   KEYPAD
========================= */

#keypad {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    width: 100%;
}

.key {

    height: 52px;

    border:
        1px solid #666;

    border-radius: 8px;

    background: #292929;

    color: #fff;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    touch-action: manipulation;

    transition:
        background .1s,
        transform .1s;
}

.key:hover {
    background: #3a3a3a;
}

.key:active {

    transform:
        scale(.96);

    background: #555;
}


/* =========================
   SPECIAL KEYS
========================= */

#clearKey {
    background: #4a2222;
}

#clearKey:hover {
    background: #632c2c;
}

#backKey {
    background: #333;
}


/* =========================
   UNLOCK
========================= */

#unlockButton {

    grid-column:
        span 3;

    height: 48px;

    margin-top: 4px;

    border: 0;

    border-radius: 8px;

    background: #fff;

    color: #000;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background .15s,
        transform .1s;
}

#unlockButton:hover {
    background: #ddd;
}

#unlockButton:active {
    transform: scale(.98);
}


/* =========================
   CLOSE
========================= */

#closeVault {

    width: 100%;

    height: 42px;

    margin-top: 10px;

    border: 0;

    border-radius: 8px;

    background: #333;

    color: #fff;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

#closeVault:hover {
    background: #444;
}


/* =========================
   MESSAGE
========================= */

#vaultMessage {

    min-height: 28px;

    margin-top: 12px;

    font-size: 16px;

    font-weight: bold;

    line-height: 28px;
}

.success {
    color: #6cff6c;
}

.error {
    color: #ff6666;
}

.warning {
    color: #ffd15c;
}


/* =========================
   MOBILE / CHROMEBOOK
========================= */

@media (max-width: 800px) {

    #vaultButton {

        top: 7px;
        right: 7px;

        padding:
            8px 12px;

        font-size: 13px;
    }

    #vaultBox {

        width: 330px;

        padding: 20px;
    }

    .key {
        height: 48px;
    }

    #codeDisplay {

        height: 50px;

        line-height: 46px;

        font-size: 26px;
    }
}

</style>

</head>


<body>


<!-- =========================
     UNITY GAME
========================= -->

<div id="unityContainer"></div>


<!-- =========================
     VAULT BUTTON
========================= -->

<button
    id="vaultButton"
    type="button">

    VAULT

</button>


<!-- =========================
     VAULT
========================= -->

<div id="vault">

    <div id="vaultBox">


        <div id="vaultTitle">
            🔐 VAULT
        </div>


        <div id="vaultDescription">
            Enter the secret code
        </div>


        <!-- CODE -->

        <div id="codeDisplay">
            • • • •
        </div>


        <!-- KEYPAD -->

        <div id="keypad">

            <button
                class="key"
                data-number="1">
                1
            </button>

            <button
                class="key"
                data-number="2">
                2
            </button>

            <button
                class="key"
                data-number="3">
                3
            </button>


            <button
                class="key"
                data-number="4">
                4
            </button>

            <button
                class="key"
                data-number="5">
                5
            </button>

            <button
                class="key"
                data-number="6">
                6
            </button>


            <button
                class="key"
                data-number="7">
                7
            </button>

            <button
                class="key"
                data-number="8">
                8
            </button>

            <button
                class="key"
                data-number="9">
                9
            </button>


            <button
                class="key"
                id="clearKey">
                CLEAR
            </button>

            <button
                class="key"
                data-number="0">
                0
            </button>

            <button
                class="key"
                id="backKey">
                ⌫
            </button>


            <button
                id="unlockButton"
                type="button">

                UNLOCK

            </button>

        </div>


        <div id="vaultMessage"></div>


        <button
            id="closeVault"
            type="button">

            CLOSE

        </button>


    </div>

</div>


<script>


/* =====================================================
   START UNITY
===================================================== */

window.gameInstance = null;


try {

    window.gameInstance =
        UnityLoader.instantiate(

            "unityContainer",

            "https://cdn.jsdelivr.net/gh/organig-schools6/99@main/Build/GunSpin%20WebGL%20FinalVersion.json",

            {
                onProgress:
                    typeof UnityProgress === "function"
                        ? UnityProgress
                        : null
            }

        );

} catch (error) {

    console.error(
        "Unity failed to start:",
        error
    );

}


/* =====================================================
   VAULT ELEMENTS
===================================================== */

var vault =
    document.getElementById("vault");

var vaultButton =
    document.getElementById("vaultButton");

var closeVault =
    document.getElementById("closeVault");

var unlockButton =
    document.getElementById("unlockButton");

var codeDisplay =
    document.getElementById("codeDisplay");

var vaultMessage =
    document.getElementById("vaultMessage");

var numberButtons =
    document.querySelectorAll(
        "[data-number]"
    );

var clearKey =
    document.getElementById("clearKey");

var backKey =
    document.getElementById("backKey");


var enteredCode = "";


/* =====================================================
   UPDATE CODE
===================================================== */

function updateCodeDisplay() {

    if (enteredCode.length === 0) {

        codeDisplay.textContent =
            "• • • •";

        return;
    }


    var display = "";


    for (
        var i = 0;
        i < enteredCode.length;
        i++
    ) {

        display += "●";

        if (
            i <
            enteredCode.length - 1
        ) {

            display += " ";

        }

    }


    codeDisplay.textContent =
        display;
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    vaultMessage.textContent =
        text;

    vaultMessage.className =
        type || "";

}


/* =====================================================
   OPEN VAULT
===================================================== */

vaultButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        enteredCode = "";

        updateCodeDisplay();

        showMessage(
            "",
            ""
        );

        vault.style.display =
            "flex";

    }
);


/* =====================================================
   NUMBER BUTTONS
===================================================== */

numberButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function(event) {

                event.preventDefault();
                event.stopPropagation();


                if (
                    enteredCode.length >= 4
                ) {

                    return;

                }


                enteredCode +=
                    button.getAttribute(
                        "data-number"
                    );


                updateCodeDisplay();

            }
        );

    }
);


/* =====================================================
   BACKSPACE
===================================================== */

backKey.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();


        enteredCode =
            enteredCode.slice(
                0,
                -1
            );


        updateCodeDisplay();

    }
);


/* =====================================================
   CLEAR
===================================================== */

clearKey.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();


        enteredCode = "";


        updateCodeDisplay();


        showMessage(
            "",
            ""
        );

    }
);


/* =====================================================
   UNITY UNLOCK
===================================================== */

function sendUnlockToUnity() {

    if (
        !window.gameInstance
    ) {

        return false;

    }


    /*
     * This is the Unity bridge.
     *
     * The names below MUST exist inside
     * the Unity game for this to work.
     */

    try {

        window.gameInstance.SendMessage(
            "GameManager",
            "UnlockBestGun",
            "5812"
        );

        return true;

    } catch (error) {

        console.error(
            "Unity unlock error:",
            error
        );

        return false;

    }

}


/* =====================================================
   UNLOCK BUTTON
===================================================== */

unlockButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();


        /* WRONG CODE */

        if (
            enteredCode !== "5812"
        ) {

            showMessage(
                "✕ WRONG CODE",
                "error"
            );

            return;

        }


        /* CORRECT CODE */

        var sent =
            sendUnlockToUnity();


        if (sent) {

            showMessage(
                "✓ VAULT CODE ACCEPTED",
                "success"
            );


            /*
             * Save the fact that the code
             * was entered on this browser.
             */

            try {

                localStorage.setItem(
                    "gunspin_vault_unlocked",
                    "true"
                );

            } catch (e) {}


            /*
             * Give Unity a moment to process
             * the message.
             */

            setTimeout(
                function() {

                    showMessage(
                        "✓ BEST GUN UNLOCK COMMAND SENT",
                        "success"
                    );

                },
                300
            );


        } else {

            /*
             * The page worked, but Unity did
             * not accept the call.
             */

            showMessage(
                "⚠ UNITY GUN DATA WAS NOT FOUND",
                "warning"
            );

        }

    }
);


/* =====================================================
   CLOSE
===================================================== */

closeVault.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        vault.style.display =
            "none";

    }
);


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            vault.style.display === "flex"
        ) {

            vault.style.display =
                "none";

        }

    }
);


/* =====================================================
   PREVENT UNITY FROM RECEIVING VAULT KEYS
===================================================== */

[
    vaultButton,
    vault,
    vaultBox
].forEach(function(element) {

    if (!element) {
        return;
    }

    element.addEventListener(
        "mousedown",
        function(event) {

            event.stopPropagation();

        },
        true
    );

    element.addEventListener(
        "mouseup",
        function(event) {

            event.stopPropagation();

        },
        true
    );

    element.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

        },
        true
    );

});


</script>

</body>
</html>
