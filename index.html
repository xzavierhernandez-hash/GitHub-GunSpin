<!DOCTYPE html>

<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GunSpin</title>

<link rel="shortcut icon"
href="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/TemplateData/favicon.ico">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/TemplateData/style.css">

<script src="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/TemplateData/UnityProgress.js"></script>

<script src="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/Build/UnityLoader.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* =========================
   UNITY GAME
========================= */

#unityContainer {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 100vw;
    height: 66.6667vw;

    max-width: 100vw;
    max-height: 100vh;

    background: black;
}


/* =========================
   VAULT BUTTON
========================= */

#vaultButton {
    position: fixed;

    top: 12px;
    right: 12px;

    z-index: 999999;

    padding: 10px 18px;

    background: #111;
    color: white;

    border: 2px solid #888;
    border-radius: 8px;

    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

#vaultButton:hover {
    background: #292929;
}


/* =========================
   VAULT OVERLAY
========================= */

#vault {
    display: none;

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1000000;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.85);
}


/* =========================
   VAULT BOX
========================= */

#vaultBox {
    width: 360px;
    max-width: 90vw;

    padding: 24px;

    background: #151515;

    color: white;

    border: 2px solid #777;
    border-radius: 14px;

    text-align: center;

    font-family: Arial, sans-serif;

    box-shadow: 0 0 35px rgba(0,0,0,0.9);
}

#vaultTitle {
    font-size: 30px;
    margin-bottom: 8px;
}

#vaultDescription {
    color: #aaa;
    margin-bottom: 18px;
}


/* =========================
   CODE DISPLAY
========================= */

#codeDisplay {
    width: 100%;
    height: 55px;

    margin-bottom: 15px;

    background: black;

    border: 2px solid #666;
    border-radius: 8px;

    color: white;

    font-family: monospace;
    font-size: 30px;
    font-weight: bold;

    letter-spacing: 8px;

    line-height: 51px;

    text-align: center;

    user-select: none;
}


/* =========================
   KEYPAD
========================= */

#keypad {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 8px;

    width: 100%;
}

.key {
    height: 52px;

    border: 1px solid #666;
    border-radius: 8px;

    background: #292929;
    color: white;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    touch-action: manipulation;
}

.key:hover {
    background: #3a3a3a;
}

.key:active {
    transform: scale(0.96);
    background: #555;
}


/* =========================
   SPECIAL KEYS
========================= */

#clearKey {
    background: #4a2222;
}

#backKey {
    background: #333;
}

#unlockButton {
    grid-column: span 3;

    height: 48px;

    margin-top: 4px;

    border: 0;
    border-radius: 8px;

    background: white;
    color: black;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

#unlockButton:hover {
    background: #ddd;
}


/* =========================
   CLOSE BUTTON
========================= */

#closeVault {
    width: 100%;

    height: 42px;

    margin-top: 10px;

    border: 0;
    border-radius: 8px;

    background: #333;
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

#closeVault:hover {
    background: #444;
}


/* =========================
   MESSAGE
========================= */

#vaultMessage {
    min-height: 28px;

    margin-top: 12px;

    font-size: 16px;
    font-weight: bold;
}

.success {
    color: #6cff6c;
}

.error {
    color: #ff6666;
}


/* =========================
   CHROMEBOOK SIZE
========================= */

@media (max-width: 800px) {

    #vaultButton {
        top: 7px;
        right: 7px;

        padding: 8px 12px;

        font-size: 13px;
    }

    #vaultBox {
        width: 330px;

        padding: 20px;
    }

    .key {
        height: 48px;
    }

    #codeDisplay {
        height: 50px;
        line-height: 46px;
    }
}
</style>

</head>

<body>

<!-- =========================
     UNITY GAME
========================= -->

<div id="unityContainer"></div>

<!-- =========================
     VAULT BUTTON
========================= -->

<button id="vaultButton" type="button">
    VAULT
</button>

<!-- =========================
     VAULT
========================= -->

<div id="vault">

```
<div id="vaultBox">

    <div id="vaultTitle">
        🔐 VAULT
    </div>

    <div id="vaultDescription">
        Enter the secret code
    </div>


    <!-- CODE DISPLAY -->

    <div id="codeDisplay">
        • • • •
    </div>


    <!-- NUMBER KEYPAD -->

    <div id="keypad">

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>

        <button class="key" id="clearKey">CLEAR</button>
        <button class="key" data-number="0">0</button>
        <button class="key" id="backKey">⌫</button>

        <button id="unlockButton">
            UNLOCK
        </button>

    </div>


    <div id="vaultMessage"></div>


    <button id="closeVault">
        CLOSE
    </button>

</div>
```

</div>

<script>

/* =========================
   START UNITY
========================= */

window.gameInstance = UnityLoader.instantiate(
    "unityContainer",
    "https://cdn.jsdelivr.net/gh/organig-schools6/99@main/Build/GunSpin%20WebGL%20FinalVersion.json"
);


/* =========================
   VAULT VARIABLES
========================= */

var vault = document.getElementById("vault");

var vaultButton =
    document.getElementById("vaultButton");

var closeVault =
    document.getElementById("closeVault");

var unlockButton =
    document.getElementById("unlockButton");

var codeDisplay =
    document.getElementById("codeDisplay");

var vaultMessage =
    document.getElementById("vaultMessage");

var numberButtons =
    document.querySelectorAll("[data-number]");

var clearKey =
    document.getElementById("clearKey");

var backKey =
    document.getElementById("backKey");


var enteredCode = "";


/* =========================
   UPDATE DISPLAY
========================= */

function updateCodeDisplay() {

    if (enteredCode.length === 0) {

        codeDisplay.textContent =
            "• • • •";

        return;
    }


    var display = "";

    for (var i = 0; i < enteredCode.length; i++) {

        display += "●";

        if (i < enteredCode.length - 1) {
            display += " ";
        }

    }


    codeDisplay.textContent = display;
}


/* =========================
   OPEN VAULT
========================= */

vaultButton.addEventListener("click", function(event) {

    event.preventDefault();
    event.stopPropagation();

    enteredCode = "";

    updateCodeDisplay();

    vaultMessage.textContent = "";
    vaultMessage.className = "";

    vault.style.display = "flex";

});


/* =========================
   NUMBER BUTTONS
========================= */

numberButtons.forEach(function(button) {

    button.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();


        if (enteredCode.length >= 4) {
            return;
        }


        enteredCode += button.getAttribute("data-number");

        updateCodeDisplay();

    });

});


/* =========================
   BACKSPACE
========================= */

backKey.addEventListener("click", function(event) {

    event.preventDefault();
    event.stopPropagation();

    enteredCode =
        enteredCode.slice(0, -1);

    updateCodeDisplay();

});


/* =========================
   CLEAR
========================= */

clearKey.addEventListener("click", function(event) {

    event.preventDefault();
    event.stopPropagation();

    enteredCode = "";

    updateCodeDisplay();

    vaultMessage.textContent = "";
    vaultMessage.className = "";

});


/* =========================
   UNLOCK
========================= */

unlockButton.addEventListener("click", function(event) {

    event.preventDefault();
    event.stopPropagation();


    if (enteredCode === "5812") {

        vaultMessage.textContent =
            "✓ BEST GUN UNLOCKED!";

        vaultMessage.className =
            "success";


        /*
         * Send the code to Unity.
         *
         * This will only actually equip the gun if
         * the Unity game contains a GameManager object
         * with an UnlockBestGun method.
         */

        if (window.gameInstance) {

            try {

                window.gameInstance.SendMessage(
                    "GameManager",
                    "UnlockBestGun",
                    "5812"
                );

            } catch (error) {

                console.log(
                    "Unity gun unlock method not found."
                );

            }

        }

    } else {

        vaultMessage.textContent =
            "✕ WRONG CODE";

        vaultMessage.className =
            "error";

    }

});


/* =========================
   CLOSE VAULT
========================= */

closeVault.addEventListener("click", function(event) {

    event.preventDefault();
    event.stopPropagation();

    vault.style.display = "none";

});


/* =========================
   ESCAPE
========================= */

document.addEventListener("keydown", function(event) {

    if (
        event.key === "Escape" &&
        vault.style.display === "flex"
    ) {

        vault.style.display = "none";

    }

});

</script>

</body>
</html>
