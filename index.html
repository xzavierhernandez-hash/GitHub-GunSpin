```html
<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GunSpin</title>

<link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/TemplateData/favicon.ico">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/TemplateData/style.css">

<script src="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/TemplateData/UnityProgress.js"></script>

<script src="https://cdn.jsdelivr.net/gh/organig-schools6/99@main/Build/UnityLoader.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#unityContainer {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: 100vw;
    height: 66.6667vw;

    max-width: 100vw;
    max-height: 100vh;

    background: #000;
}

/* VAULT BUTTON */
#vaultButton {
    position: fixed;
    right: 12px;
    top: 12px;

    z-index: 999999;

    padding: 9px 16px;

    background: #111;
    color: #fff;

    border: 2px solid #777;
    border-radius: 7px;

    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

#vaultButton:hover {
    background: #292929;
}

/* VAULT BACKGROUND */
#vault {
    display: none;

    position: fixed;
    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1000000;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.82);
}

/* VAULT BOX */
#vaultBox {
    width: 360px;
    max-width: 90vw;

    padding: 25px;

    background: #151515;

    border: 2px solid #777;
    border-radius: 12px;

    text-align: center;

    font-family: Arial, sans-serif;
    color: white;

    box-shadow: 0 0 30px rgba(0,0,0,0.9);
}

#vaultBox h1 {
    margin-bottom: 8px;
    font-size: 28px;
}

#vaultBox p {
    margin-bottom: 18px;
    color: #bbb;
}

/* CODE INPUT */
#vaultCode {
    display: block;

    width: 100%;
    height: 48px;

    padding: 10px;

    background: #000;
    color: #fff;

    border: 2px solid #555;
    border-radius: 7px;

    outline: none;

    font-family: Arial, sans-serif;
    font-size: 22px;

    text-align: center;

    /* Prevent Unity from stealing the input */
    pointer-events: auto;
    user-select: text;
    -webkit-user-select: text;
}

#vaultCode:focus {
    border-color: #fff;
}

/* BUTTONS */
.vaultButton {
    margin-top: 12px;

    height: 42px;

    padding: 0 18px;

    border: 0;
    border-radius: 7px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

#unlockButton {
    background: white;
    color: black;
}

#closeVault {
    margin-left: 6px;

    background: #333;
    color: white;
}

/* MESSAGE */
#vaultMessage {
    min-height: 25px;

    margin-top: 15px;

    font-family: Arial, sans-serif;
    font-weight: bold;
}

.success {
    color: #70ff70;
}

.error {
    color: #ff7070;
}

/* SMALL CHROMEBOOK SCREENS */
@media (max-width: 800px) {

    #vaultButton {
        top: 7px;
        right: 7px;

        padding: 7px 11px;
        font-size: 13px;
    }

    #vaultBox {
        width: 320px;
        padding: 20px;
    }
}
</style>
</head>

<body>

<!-- UNITY GAME -->
<div id="unityContainer"></div>


<!-- VAULT BUTTON -->
<button id="vaultButton" type="button">
    VAULT
</button>


<!-- VAULT WINDOW -->
<div id="vault">

    <div id="vaultBox">

        <h1>VAULT</h1>

        <p>Enter the secret code.</p>

        <input
            id="vaultCode"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            maxlength="4"
            placeholder="CODE"
        >

        <button
            id="unlockButton"
            class="vaultButton"
            type="button">
            UNLOCK
        </button>

        <button
            id="closeVault"
            class="vaultButton"
            type="button">
            CLOSE
        </button>

        <div id="vaultMessage"></div>

    </div>

</div>


<script>
/* ==========================
   START UNITY
========================== */

window.gameInstance = UnityLoader.instantiate(
    "unityContainer",
    "https://cdn.jsdelivr.net/gh/organig-schools6/99@main/Build/GunSpin%20WebGL%20FinalVersion.json"
);


/* ==========================
   VAULT ELEMENTS
========================== */

var vault = document.getElementById("vault");
var vaultButton = document.getElementById("vaultButton");
var closeVault = document.getElementById("closeVault");
var unlockButton = document.getElementById("unlockButton");
var vaultCode = document.getElementById("vaultCode");
var vaultMessage = document.getElementById("vaultMessage");


/* ==========================
   OPEN VAULT
========================== */

vaultButton.onclick = function(event) {

    event.preventDefault();
    event.stopPropagation();

    vault.style.display = "flex";

    vaultCode.value = "";
    vaultMessage.innerHTML = "";
    vaultMessage.className = "";

    setTimeout(function() {
        vaultCode.focus();
    }, 50);
};


/* ==========================
   CLOSE VAULT
========================== */

closeVault.onclick = function(event) {

    event.preventDefault();
    event.stopPropagation();

    vault.style.display = "none";

    vaultCode.blur();
};


/* ==========================
   UNLOCK FUNCTION
========================== */

function unlockVault() {

    var code = vaultCode.value;

    if (code === "5812") {

        vaultMessage.innerHTML =
            "✓ BEST GUN UNLOCKED!";

        vaultMessage.className = "success";


        /*
         * Send the unlock request to Unity.
         *
         * This requires your Unity project to contain:
         *
         * GameObject: GameManager
         * Method: UnlockBestGun
         *
         * If those don't exist, the Vault still works,
         * but the gun itself cannot be changed from HTML.
         */

        if (window.gameInstance) {

            try {

                window.gameInstance.SendMessage(
                    "GameManager",
                    "UnlockBestGun",
                    "5812"
                );

            } catch (e) {

                console.log(
                    "Unity unlock method is not available."
                );

            }

        }

    } else {

        vaultMessage.innerHTML =
            "✕ WRONG CODE";

        vaultMessage.className = "error";

    }
}


/* ==========================
   UNLOCK BUTTON
========================== */

unlockButton.onclick = function(event) {

    event.preventDefault();
    event.stopPropagation();

    unlockVault();
};


/* ==========================
   KEYBOARD
========================== */

vaultCode.onkeydown = function(event) {

    /*
     * Stop Unity from receiving the key.
     * This allows typing AND backspace.
     */

    event.stopPropagation();

    if (event.key === "Enter") {

        event.preventDefault();

        unlockVault();

    }

};


/* ==========================
   KEYUP
========================== */

vaultCode.onkeyup = function(event) {

    event.stopPropagation();

};


/* ==========================
   KEYPRESS
========================== */

vaultCode.onkeypress = function(event) {

    event.stopPropagation();

};


/* ==========================
   CLICK INPUT
========================== */

vaultCode.onclick = function(event) {

    event.stopPropagation();

};


/* ==========================
   ESCAPE
========================== */

document.addEventListener("keydown", function(event) {

    if (
        event.key === "Escape" &&
        vault.style.display === "flex"
    ) {

        event.preventDefault();

        vault.style.display = "none";

        vaultCode.blur();

    }

});
</script>

</body>
</html>
